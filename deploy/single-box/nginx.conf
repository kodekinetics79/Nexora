# Serves the built SPA and proxies the API to the backend on loopback.
# Runs with host networking, so "backend" is 127.0.0.1:8080 rather than a service name.

server {
    listen 80;
    server_name _;

    # RFQ attachments and BoQ spreadsheets are routinely larger than the nginx default of 1 MB.
    # The application enforces its own per-document limits; this only stops nginx rejecting an
    # upload before the governed intake ever sees it.
    client_max_body_size 64m;

    # The extraction path is deliberately slower than a normal request. These are generous on
    # purpose: a timeout here surfaces to the user as a failed upload rather than as the
    # honest "held for review" outcome the pipeline would otherwise produce.
    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Operator surfaces. Kept off the public path deliberately: /ready aggregates evidence
    # storage, malware scanner and worker heartbeats, and is not something a tenant user needs.
    location = /health { proxy_pass http://127.0.0.1:8080/health; }
    location = /ready  {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8080/ready;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
