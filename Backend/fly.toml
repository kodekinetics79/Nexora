# Fly.io deployment for the Nexora backend. Deploy from the Backend/ directory:
#   fly launch --no-deploy      (first time, creates the app)
#   fly secrets set ...         (see DEPLOYMENT.md)
#   fly deploy
app = "nexora-api"
primary_region = "iad"   # US East — same region as the Neon database (us-east-1)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
