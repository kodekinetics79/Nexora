<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: login-chain-ledger-a.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cambay:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#08172a}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1487px">
  <div class="r-brand region chrome" data-region="brand"><!-- Nexora mark and wordmark on navy --></div>
  <div class="r-ledger-headline region text" data-region="ledger-headline"><!-- Every commercial decision, connected to its evidence. --><p style="font-size:var(--r-ledger-headline-font);font-family:var(--r-ledger-headline-family),sans-serif;font-weight:var(--r-ledger-headline-weight);line-height:1.05;margin:0">ledger-headline</p></div>
  <div class="r-ledger-kicker region text" data-region="ledger-kicker"><!-- Commercial chain-of-custody command ledger label --><p style="font-size:var(--r-ledger-kicker-font);line-height:1.05;margin:0">ledger-kicker</p></div>
  <div class="r-enquiry-meta region text" data-region="enquiry-meta"><!-- Synthetic enquiry reference, account, value, created time and owner --><p style="font-size:var(--r-enquiry-meta-font);line-height:1.05;margin:0">enquiry-meta</p></div>
  <div class="r-journey-labels region text" data-region="journey-labels"><!-- Email captured through Payment posted stage labels and times --><p style="font-size:var(--r-journey-labels-font);line-height:1.05;margin:0">journey-labels</p></div>
  <div class="r-journey-line region chrome" data-region="journey-line"><!-- Code-drawn connected stage line with six restrained circular status markers --></div>
  <div class="r-evidence-table region chrome" data-region="evidence-table"><!-- Code-drawn compact evidence ledger table with status, source, reference, approved lines, amount, actor and notes --></div>
  <div class="r-integrity-note region chrome" data-region="integrity-note"><!-- Ledger integrity assurance row; no export action in the implemented sign-in screen --></div>
  <div class="r-theme-toggle region control" data-region="theme-toggle"><!-- Light and dark theme toggle: rebuild the control's chrome from the crop (comp-spec.mjs --crop theme-toggle); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-signin-heading region text" data-region="signin-heading"><!-- Sign in to Nexora --><p style="font-size:var(--r-signin-heading-font);line-height:1.05;margin:0">signin-heading</p></div>
  <div class="r-signin-support region text" data-region="signin-support"><!-- Truthful procurement and order-to-cash workspace explanation --><p style="font-size:var(--r-signin-support-font);line-height:1.05;margin:0">signin-support</p></div>
  <div class="r-email-field region control" data-region="email-field"><!-- Email address label and visible bordered input: rebuild the control's chrome from the crop (comp-spec.mjs --crop email-field); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-password-field region control" data-region="password-field"><!-- Password label, visible bordered input and reveal control: rebuild the control's chrome from the crop (comp-spec.mjs --crop password-field); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-forgot-password region control" data-region="forgot-password"><!-- Forgot password recovery link: rebuild the control's chrome from the crop (comp-spec.mjs --crop forgot-password); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-signin-action region control" data-region="signin-action"><!-- Primary Sign in button: rebuild the control's chrome from the crop (comp-spec.mjs --crop signin-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-platform-link region control" data-region="platform-link"><!-- Quiet Platform administration link separated by a fine rule: rebuild the control's chrome from the crop (comp-spec.mjs --crop platform-link); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
