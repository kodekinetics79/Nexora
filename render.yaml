services:
  # ---------------------------------------------------------------------------
  # NOTE: the ClamAV private service is intentionally NOT deployed right now.
  # DocumentInspection__Scanner__Provider is set to BuiltIn below, which is a
  # structural inspector (content-type sniffing, size caps, OOXML archive and
  # zip-bomb defence, macro rejection) but is NOT an anti-virus engine and
  # detects no real malware. It logs REDUCED SECURITY POSTURE on every boot.
  #
  # To enable real scanning: paste the `nexora-clamav` service and the
  # ClamAV__Host fromService reference from docs/RUNBOOK-CLAMAV-RENDER.md
  # ("Deferred configuration" section), set Provider back to ClamAV, and sync
  # the Blueprint. Cost: +$85/mo on Render `pro`.
  # ---------------------------------------------------------------------------
  - type: web
    name: nexora-fyjw
    runtime: docker
    rootDir: Backend
    dockerfilePath: ./Dockerfile
    # LIVENESS ONLY. /ready additionally aggregates evidence-storage + malware-scanner
    # + worker heartbeats, and today the evidence-storage check reports Unhealthy for a
    # local (disk-backed) store by design — pointing the platform health check at /ready
    # would restart-loop a service that is actually serving traffic correctly.
    # /health is tag-filtered to "live" checks (Program.cs MapHealthChecks).
    healthCheckPath: /health
    # Persistent disk. Documents are content-addressed evidence and are NEVER deleted by
    # the application, so losing this volume is unrecoverable data loss, not a cache miss.
    # Render preserves ONLY paths under mountPath across deploys and restarts.
    disk:
      name: nexora-evidence
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # MUST sit under the disk mountPath above. This previously read /tmp with
      # enforcement disabled — a Blueprint sync of that value would have silently
      # relocated every upload onto the ephemeral container filesystem and destroyed
      # the document estate on the next restart, with no error at any layer.
      - key: Storage__RootPath
        value: /var/data/nexora/uploads
      - key: Storage__RequiredMountPath
        value: /var/data
      # Fail-closed: LocalFileStorage verifies the mount exists and write-probes it at
      # startup, and REFUSES TO BOOT if the volume is missing. A loud failed deploy is
      # the correct outcome; silently writing to ephemeral storage is not.
      - key: Storage__EnforcePersistentMount
        value: "true"
      # Evidence object storage: LOCAL (disk-backed), decided deliberately for the pilot.
      # Program.cs selects S3EvidenceObjectStorage only when this equals "S3"; any other
      # value falls through to LocalEvidenceObjectStorage over the persistent disk above.
      # This previously read "S3" while production had it UNSET — a Blueprint sync would
      # have constructed the S3 client with EMPTY credentials (the four vars below are
      # sync:false and were never populated) and broken evidence storage outright.
      #
      # To move to object storage later: set this to S3 and populate the four commented
      # variables. NOTE for whoever does that — Cloudflare R2 does NOT implement object
      # versioning, and VerifyBucketVersioningAsync swallows the resulting 501, so the
      # versioning guarantee the S3 path advertises is silently absent on R2. Prefer a
      # provider with real versioning, and convert the legacy physical-path writers
      # (FolderService, EmailService, ManualUploadService) at the same time or the
      # document estate ends up split across two stores with two restore procedures.
      - key: EvidenceStorage__Provider
        value: Local
      # - key: EvidenceStorage__ServiceUrl
      #   sync: false
      # - key: EvidenceStorage__Region
      #   value: auto
      # - key: EvidenceStorage__AccessKeyId
      #   sync: false
      # - key: EvidenceStorage__SecretAccessKey
      #   sync: false
      # - key: EvidenceStorage__Bucket
      #   sync: false
      # PILOT POSTURE — READ BEFORE PRODUCTION.
      # BuiltIn is NOT an anti-virus engine. It performs structural inspection
      # only (content-type sniffing, size caps, OOXML archive validation,
      # zip-bomb and zip-slip defence, macro rejection) plus EICAR detection.
      # It will NOT detect real malware. MalwareScannerFactory logs a
      # REDUCED SECURITY POSTURE warning on every boot while this is set.
      # Chosen deliberately to defer the +$85/mo ClamAV service until after the
      # client pilot. Restore ClamAV per docs/RUNBOOK-CLAMAV-RENDER.md before
      # any production tenant uploads documents.
      - key: DocumentInspection__Scanner__Provider
        value: BuiltIn
      # Hardcoded rather than `property: port`: that property is documented as
      # "the port of the service's HTTP server" and clamd does not speak HTTP.
      # 3310 is clamd's fixed listener in the upstream image.
      - key: DocumentInspection__ClamAV__Port
        value: "3310"
      # Per-scan deadline. Covers connect + INSTREAM upload + verdict for a
      # 25 MB file over the private network.
      - key: DocumentInspection__ClamAV__Timeout
        value: "00:00:30"
      - key: DocumentInspection__MalwareVerdictPolicy__MaximumCleanVerdictAge
        value: "24:00:00"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: ConnectionStrings__MigrationConnection
        sync: false
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: Database__AllowManagedOwnerRoleMigrationCompatibility
        value: "true"
      - key: Jwt__Key
        sync: false
      # REQUIRED. Base64 of 32 random bytes (`openssl rand -base64 32`). Encrypts stored
      # CUSTOMER MAILBOX credentials (Email_Configurations.Password) at rest with AES-256-GCM.
      # The API REFUSES TO START outside Development without it. Rotating or losing this value
      # makes every already-encrypted mailbox password undecryptable, and polling stops until
      # the credentials are re-entered — treat it like Jwt__Key.
      - key: Security__SecretProtectionKey
        sync: false
      - key: Jwt__PlatformKey
        sync: false
      - key: CommercialFinance__DunningProviderWebhookSecret
        sync: false
      - key: CommercialFinance__ContactVerificationSecret
        sync: false
      - key: CommercialFinance__AuditActorSecret
        sync: false
      - key: Ollama__BaseUrl
        sync: false
      - key: Ollama__ApiKey
        sync: false
      - key: Cors__AllowedOrigins__0
        value: https://nexora1-ai.vercel.app
      # -----------------------------------------------------------------------
      # OBSERVABILITY. Read before changing anything here.
      #
      # WHAT WAS BROKEN: NexoraMetrics defined a full instrument set, Program.cs
      # registered the meter, and this file set no Observability__* variable at
      # all. ObservabilityExtensions registers an exporter only when
      # Observability__OtlpEndpoint is a valid absolute URI, or (Development
      # only) a console exporter — so in Production NO exporter was registered.
      # Every counter, histogram and gauge was collected in-process and thrown
      # away. A dashboard would have read flat zero, and flat zero reads as
      # "healthy". The platform was running blind.
      #
      # WHAT FIXES IT WITHOUT A COLLECTOR: nothing below is required. With no
      # OTLP endpoint set, ObservabilityExtensions.SelectExporter now enables
      # the built-in, zero-dependency Prometheus scrape endpoint at /metrics
      # (Platform/Hardening/PrometheusScrapeEndpoint.cs) and the boot log states
      # which exporter is live. Point any scraper at
      # https://<service>.onrender.com/metrics.
      #
      # SECURITY: /metrics carries tenant ids, per-tenant queue depth and
      # per-tenant oldest-pending-job age. It is operational data, not public
      # data, and the app logs a startup WARNING for as long as it is
      # unauthenticated. Set the scrape key below and configure the scraper to
      # send it as the X-Scrape-Key header.
      #
      # - key: Observability__Prometheus__ScrapeKey
      #   sync: false
      #
      # TO SEND TO A COLLECTOR INSTEAD (Grafana Cloud / Honeycomb / an OTel
      # collector sidecar), uncomment exactly this — an absolute URI including
      # the scheme and port, OTLP/gRPC on 4317 or OTLP/HTTP on 4318. Setting it
      # switches the exporter to OTLP and turns the /metrics endpoint OFF
      # (SelectExporter treats the scrape endpoint as the fallback), which is
      # visible in the boot log. An unparseable value degrades to "no OTLP" and
      # is logged as a configuration ERROR; it never crashes the host.
      #
      # - key: Observability__OtlpEndpoint
      #   value: http://otel-collector:4317
      #
      # Vendor collectors that authenticate with a header (e.g. Grafana Cloud's
      # basic-auth token) additionally need the standard OTLP variable, which
      # the exporter reads directly from the environment:
      #
      # - key: OTEL_EXPORTER_OTLP_HEADERS
      #   sync: false        # e.g. Authorization=Basic <base64 instanceID:token>
      #
      # To run BOTH (push to a collector and keep the scrape endpoint for local
      # debugging), set Observability__Prometheus__Enabled to "true" explicitly.
      #
      # Queue-gauge poll cadence. One bounded GROUP BY over ExtractionJobs per
      # interval feeds every per-tenant gauge — including oldest pending job
      # age, the only signal that reveals a starving tenant. There is no
      # per-request and no per-scrape query. Default 00:00:15; raise it only if
      # the database is under pressure.
      #
      # - key: Observability__QueueMetrics__PollInterval
      #   value: "00:00:15"
      # -----------------------------------------------------------------------
