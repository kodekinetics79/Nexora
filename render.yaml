# =============================================================================
# THIS FILE IS NOT WHAT IS RUNNING. Read this before trusting anything below.
#
# The production web service was created by hand in the Render dashboard, not
# from this Blueprint, and nothing syncs the two. Every value here is a
# DESCRIPTION of intent; the dashboard is the configuration. Confirmed against
# the Render API on 2026-08-12 — the live service and this file already disagree
# in three places:
#
#     this file            live service (GET /v1/services/srv-d9csjhe1a83c739phue0)
#     name: nexora-fyjw    name: Nexora
#     rootDir: Backend     rootDir: ""   (dockerContext Backend, dockerfilePath Backend/Dockerfile)
#     autoDeployTrigger    was `commit` until it was set to `checksPass` BY HAND
#
# That third line is why this warning exists rather than a tidier comment. The
# `autoDeployTrigger: checksPass` block below was added on 2026-08-11 to stop
# red commits deploying, it was reviewed, merged, and it changed nothing at all
# for a day: Render never read it. The deploy gate existed only in this file.
# It was believed to be live, and it was quoted as live, until somebody asked
# the API instead of reading the YAML.
#
# So: a change here has NO effect until either it is applied in the dashboard or
# this service is linked to the Blueprint. If you link it, delete this banner and
# reconcile the three rows above first — a sync would otherwise rename the
# service and move its root directory.
#
# Verify, do not assume:
#   curl -H "Authorization: Bearer $RENDER_API_KEY" \
#     https://api.render.com/v1/services/srv-d9csjhe1a83c739phue0
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # NOTE: the ClamAV private service is intentionally NOT deployed right now.
  # DocumentInspection__Scanner__Provider is set to BuiltIn below, which is a
  # structural inspector (content-type sniffing, size caps, OOXML archive and
  # zip-bomb defence, macro rejection) but is NOT an anti-virus engine and
  # detects no real malware. It logs REDUCED SECURITY POSTURE on every boot.
  #
  # To enable real scanning: paste the `nexora-clamav` service and the
  # ClamAV__Host fromService reference from docs/RUNBOOK-CLAMAV-RENDER.md
  # ("Deferred configuration" section), set Provider back to ClamAV, and sync
  # the Blueprint. Cost: +$85/mo on Render `pro`.
  # ---------------------------------------------------------------------------
  - type: web
    name: nexora-fyjw
    runtime: docker
    rootDir: Backend
    dockerfilePath: ./Dockerfile
    # ---------------------------------------------------------------------------
    # DEPLOY ONLY WHAT CI HAS ALREADY GONE GREEN ON.
    #
    # Render's default is `commit`: every push to the connected branch deploys,
    # and the deploy starts BEFORE — often instead of — anyone looking at CI. That
    # made CI advisory. It is not a theoretical exposure here: at the time this was
    # written the last five pushes to `main` all left CI red, and all five deployed
    # anyway. `checksPass` makes Render wait for the commit's GitHub checks and
    # deploy only if they succeed.
    #
    # It is worth more on this service than on a typical one because of
    # Database__ApplyMigrationsOnStartup below. The container applies migrations at
    # BOOT. A migration that does not apply is therefore not a failed test, it is a
    # service that will not start, on the running production database, with no
    # rollback — the image cannot be rolled back to a schema that no longer exists.
    # CI already proves the migration estate applies: the suite migrates a fresh
    # postgres:16-alpine, walks the squashed baseline Up -> Down -> Up comparing
    # catalogue digests, and applies it again through a NOSUPERUSER / NOBYPASSRLS
    # owner with ManagedPostgresMigrationCommandInterceptor — the same shape and the
    # same code path this service boots with. That proof was simply not connected to
    # anything. This line connects it.
    #
    # REQUIRES the workflow's `CI green` job (.github/workflows/ci.yml) to be a
    # required status check on `main`; see the repo-settings note there. Without a
    # required check there is nothing for `checksPass` to wait on.
    #
    # If a Blueprint sync ever rejects this key, the identical setting lives at
    # Render Dashboard -> nexora-fyjw -> Settings -> Build & Deploy -> Auto-Deploy
    # -> "After CI Checks Pass". Do not "fix" a sync error by deleting the line and
    # leaving auto-deploy on commit.
    # ---------------------------------------------------------------------------
    autoDeployTrigger: checksPass
    # LIVENESS ONLY. /ready additionally aggregates evidence-storage + malware-scanner
    # + worker heartbeats, and today the evidence-storage check reports Unhealthy for a
    # local (disk-backed) store by design — pointing the platform health check at /ready
    # would restart-loop a service that is actually serving traffic correctly.
    # /health is tag-filtered to "live" checks (Program.cs MapHealthChecks).
    healthCheckPath: /health
    # Persistent disk. Documents are content-addressed evidence and are NEVER deleted by
    # the application, so losing this volume is unrecoverable data loss, not a cache miss.
    # Render preserves ONLY paths under mountPath across deploys and restarts.
    disk:
      name: nexora-evidence
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # MUST sit under the disk mountPath above. This previously read /tmp with
      # enforcement disabled — a Blueprint sync of that value would have silently
      # relocated every upload onto the ephemeral container filesystem and destroyed
      # the document estate on the next restart, with no error at any layer.
      - key: Storage__RootPath
        value: /var/data/nexora/uploads
      - key: Storage__RequiredMountPath
        value: /var/data
      # Fail-closed: LocalFileStorage verifies the mount exists and write-probes it at
      # startup, and REFUSES TO BOOT if the volume is missing. A loud failed deploy is
      # the correct outcome; silently writing to ephemeral storage is not.
      - key: Storage__EnforcePersistentMount
        value: "true"
      # Evidence object storage: LOCAL (disk-backed), decided deliberately for the pilot.
      # Program.cs selects S3EvidenceObjectStorage only when this equals "S3"; any other
      # value falls through to LocalEvidenceObjectStorage over the persistent disk above.
      # This previously read "S3" while production had it UNSET — a Blueprint sync would
      # have constructed the S3 client with EMPTY credentials (the four vars below are
      # sync:false and were never populated) and broken evidence storage outright.
      #
      # To move to object storage later: set this to S3 and populate the four commented
      # variables. NOTE for whoever does that — Cloudflare R2 does NOT implement object
      # versioning, and VerifyBucketVersioningAsync swallows the resulting 501, so the
      # versioning guarantee the S3 path advertises is silently absent on R2. Prefer a
      # provider with real versioning, and convert the legacy physical-path writers
      # (FolderService, EmailService, ManualUploadService) at the same time or the
      # document estate ends up split across two stores with two restore procedures.
      - key: EvidenceStorage__Provider
        value: Local
      # - key: EvidenceStorage__ServiceUrl
      #   sync: false
      # - key: EvidenceStorage__Region
      #   value: auto
      # - key: EvidenceStorage__AccessKeyId
      #   sync: false
      # - key: EvidenceStorage__SecretAccessKey
      #   sync: false
      # - key: EvidenceStorage__Bucket
      #   sync: false
      # PILOT POSTURE — READ BEFORE PRODUCTION.
      # BuiltIn is NOT an anti-virus engine. It performs structural inspection
      # only (content-type sniffing, size caps, OOXML archive validation,
      # zip-bomb and zip-slip defence, macro rejection) plus EICAR detection.
      # It will NOT detect real malware. MalwareScannerFactory logs a
      # REDUCED SECURITY POSTURE warning on every boot while this is set.
      # Chosen deliberately to defer the +$85/mo ClamAV service until after the
      # client pilot. Restore ClamAV per docs/RUNBOOK-CLAMAV-RENDER.md before
      # any production tenant uploads documents.
      - key: DocumentInspection__Scanner__Provider
        value: BuiltIn
      # Hardcoded rather than `property: port`: that property is documented as
      # "the port of the service's HTTP server" and clamd does not speak HTTP.
      # 3310 is clamd's fixed listener in the upstream image.
      - key: DocumentInspection__ClamAV__Port
        value: "3310"
      # Per-scan deadline. Covers connect + INSTREAM upload + verdict for a
      # 25 MB file over the private network.
      - key: DocumentInspection__ClamAV__Timeout
        value: "00:00:30"
      - key: DocumentInspection__MalwareVerdictPolicy__MaximumCleanVerdictAge
        value: "24:00:00"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # REQUIRED WHENEVER the compatibility flag below is "true": Program.cs throws at startup
      # ("Managed owner migration compatibility requires an explicit
      # ConnectionStrings:MigrationConnection separate from the least-privilege runtime
      # connection.") rather than run migrations on the runtime role. Populating only
      # DefaultConnection and syncing this Blueprint therefore produces a deploy that fails at
      # boot with no request ever served.
      - key: ConnectionStrings__MigrationConnection
        sync: false
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: Database__AllowManagedOwnerRoleMigrationCompatibility
        value: "true"
      - key: Jwt__Key
        sync: false
      # REQUIRED. Base64 of 32 random bytes (`openssl rand -base64 32`). Encrypts stored
      # CUSTOMER MAILBOX credentials (Email_Configurations.Password) at rest with AES-256-GCM.
      # The API REFUSES TO START outside Development without it. Rotating or losing this value
      # makes every already-encrypted mailbox password undecryptable, and polling stops until
      # the credentials are re-entered — treat it like Jwt__Key.
      - key: Security__SecretProtectionKey
        sync: false
      # REQUIRED, and DISTINCT from Jwt__Key. AddPlatformJwtBearer THROWS at startup outside
      # Development/Testing when this is missing, and throws again when it equals Jwt__Key —
      # the platform control plane and the tenant plane must not be able to forge each other's
      # tokens. A deploy that syncs this Blueprint without populating it fails at boot, before
      # the first request, with no other symptom.
      - key: Jwt__PlatformKey
        sync: false
      # -----------------------------------------------------------------------
      # THE FIRST PLATFORM OPERATOR. Without these two, a fresh deployment has NO
      # platform user at all and the operator console at /platform cannot be signed
      # into by anybody — which means no tenant can ever be provisioned, and the
      # whole customer journey has no entry point.
      #
      # PlatformOwnerSeeder (Platform/Services/PlatformOwnerSeeder.cs) runs in
      # Production deliberately, and is fail-closed in every direction:
      #   * both unset  -> silently does nothing (this is what protects Production
      #                    from an accidental account, and what left a fresh deploy
      #                    locked out when these keys were absent from this file);
      #   * one set     -> logs a warning and creates nothing;
      #   * password < 12 chars -> refused and logged;
      #   * ANY platform user already present -> skipped. It can only ever create
      #     the very first account, never rotate or resurrect one, so leaving these
      #     populated after the first boot is inert.
      #
      # NOT to be confused with DemoUser__Enabled + PlatformOwner__Email/Password.
      # That is DemoUserSeeder, which REFUSES to run under ASPNETCORE_ENVIRONMENT
      # Production (it provisions a tenant Super Admin with both tenant-isolation
      # layers off) and will log an error and create nothing here.
      #
      # After the first successful boot, rotate through /api/platform/users and
      # enroll MFA — every privileged platform policy requires a second factor.
      - key: Platform__BootstrapOwnerEmail
        sync: false
      - key: Platform__BootstrapOwnerPassword
        sync: false
      # -----------------------------------------------------------------------
      - key: CommercialFinance__DunningProviderWebhookSecret
        sync: false
      - key: CommercialFinance__ContactVerificationSecret
        sync: false
      - key: CommercialFinance__AuditActorSecret
        sync: false
      - key: Ollama__BaseUrl
        sync: false
      - key: Ollama__ApiKey
        sync: false
      # ---------------------------------------------------------------------
      # OUTBOUND EMAIL IS DELIBERATELY NOT CONFIGURED HERE.
      #
      # A fresh deploy starts on the `console` provider from appsettings.json,
      # which writes every message to the log and DISCARDS it. That is a real
      # state, not a placeholder: until somebody configures a transport, tenant
      # activation links, quotes and invoice notices reach nobody. The API says
      # so at boot (OutboundEmailSettingsWarmup logs an error), /health reports
      # Degraded, and the platform email screen leads with "No mail is leaving
      # this system".
      #
      # It is configured at Platform Admin -> Email, NOT with Notifications__*
      # variables here, and that is the decision rather than an omission:
      #
      #   * The stored row overrides this file at runtime, so a variable set
      #     here would be silently outranked the moment an operator saves —
      #     two sources of truth, one of them invisible from the console.
      #   * The SMTP password would have to be a `sync: false` entry, which
      #     renders in the Render dashboard as a configured-looking key that is
      #     in fact empty. A half-set transport fails at SEND time, long after
      #     the deploy went green.
      #   * The screen encrypts the credential at rest under
      #     Security__SecretProtectionKey above, audits who changed it and why,
      #     and can prove delivery with a real test send. A blueprint variable
      #     does none of that.
      #
      # If a future deployment genuinely needs mail working before an operator
      # can sign in, seed the platform.PlatformEmailSettings row at provision
      # time — do not reintroduce these variables.
      # ---------------------------------------------------------------------
      - key: Cors__AllowedOrigins__0
        value: https://nexora1-ai.vercel.app
      # WEB-TESTING POSTURE. Platform JWT, MFA and live-session validation remain mandatory,
      # but client/VPN CIDRs and the trusted edge proxy contract have not yet been supplied.
      # Change to AllowList and configure PlatformAccess__AllowedCidrs plus the trusted
      # ForwardedHeaders ranges before production security sign-off.
      - key: PlatformAccess__NetworkMode
        value: Any
      # -----------------------------------------------------------------------
      # OBSERVABILITY. Read before changing anything here.
      #
      # WHAT WAS BROKEN: NexoraMetrics defined a full instrument set, Program.cs
      # registered the meter, and this file set no Observability__* variable at
      # all. ObservabilityExtensions registers an exporter only when
      # Observability__OtlpEndpoint is a valid absolute URI, or (Development
      # only) a console exporter — so in Production NO exporter was registered.
      # Every counter, histogram and gauge was collected in-process and thrown
      # away. A dashboard would have read flat zero, and flat zero reads as
      # "healthy". The platform was running blind.
      #
      # WHAT FIXES IT WITHOUT A COLLECTOR: nothing below is required. With no
      # OTLP endpoint set, ObservabilityExtensions.SelectExporter now enables
      # the built-in, zero-dependency Prometheus scrape endpoint at /metrics
      # (Platform/Hardening/PrometheusScrapeEndpoint.cs) and the boot log states
      # which exporter is live. Point any scraper at
      # https://<service>.onrender.com/metrics.
      #
      # SECURITY: /metrics carries tenant ids, per-tenant queue depth and
      # per-tenant oldest-pending-job age. It is operational data, not public
      # data, and the app logs a startup WARNING for as long as it is
      # unauthenticated. Set the scrape key below and configure the scraper to
      # send it as the X-Scrape-Key header.
      #
      # - key: Observability__Prometheus__ScrapeKey
      #   sync: false
      # Until a protected scraper or OTLP collector is supplied, fail closed by not exposing
      # tenant-bearing queue metrics at all. The application refuses anonymous Production scrape.
      - key: Observability__Prometheus__Enabled
        value: "false"
      #
      # TO SEND TO A COLLECTOR INSTEAD (Grafana Cloud / Honeycomb / an OTel
      # collector sidecar), uncomment exactly this — an absolute URI including
      # the scheme and port, OTLP/gRPC on 4317 or OTLP/HTTP on 4318. Setting it
      # switches the exporter to OTLP and turns the /metrics endpoint OFF
      # (SelectExporter treats the scrape endpoint as the fallback), which is
      # visible in the boot log. An unparseable value degrades to "no OTLP" and
      # is logged as a configuration ERROR; it never crashes the host.
      #
      # - key: Observability__OtlpEndpoint
      #   value: http://otel-collector:4317
      #
      # Vendor collectors that authenticate with a header (e.g. Grafana Cloud's
      # basic-auth token) additionally need the standard OTLP variable, which
      # the exporter reads directly from the environment:
      #
      # - key: OTEL_EXPORTER_OTLP_HEADERS
      #   sync: false        # e.g. Authorization=Basic <base64 instanceID:token>
      #
      # To run BOTH (push to a collector and keep the scrape endpoint for local
      # debugging), set Observability__Prometheus__Enabled to "true" explicitly.
      #
      # Queue-gauge poll cadence. One bounded GROUP BY over ExtractionJobs per
      # interval feeds every per-tenant gauge — including oldest pending job
      # age, the only signal that reveals a starving tenant. There is no
      # per-request and no per-scrape query. Default 00:00:15; raise it only if
      # the database is under pressure.
      #
      # - key: Observability__QueueMetrics__PollInterval
      #   value: "00:00:15"
      # -----------------------------------------------------------------------
