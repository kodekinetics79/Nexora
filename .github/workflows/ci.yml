name: CI

on:
  push:
    branches: [main, reliability-hardening]
  pull_request:
    branches: [main, reliability-hardening]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required by dorny/paths-filter on a PULL REQUEST: it asks the API which files the PR
  # changed, and without this the token cannot read them. The failure is quiet in the worst
  # way — "Resource not accessible by integration" fails the Detect changes job, which both
  # test jobs depend on, so Backend and Frontend report SKIPPING rather than failing and the
  # PR looks like it has simply chosen not to run its suites. A push to a branch never hits
  # this path (paths-filter compares commits directly), so it surfaced only on the first PR.
  pull-requests: read

jobs:
  # Detect which parts of the tree changed so the backend job doesn't run for a
  # frontend-only change and vice versa.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'Frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (.NET 8)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Cache the global NuGet package folder, keyed on the project files.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ERP_RFQ_Automation.sln

      - name: Build
        run: dotnet build ERP_RFQ_Automation.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test ERP_RFQ_Automation.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ../TestResults

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: List browser acceptance suite
        run: npm run e2e:list

      - name: Install Playwright Chromium
        if: ${{ vars.E2E_ACCEPTANCE_ENABLED == 'true' }}
        run: npm run e2e:install

      - name: Run authenticated browser acceptance
        if: ${{ vars.E2E_ACCEPTANCE_ENABLED == 'true' }}
        run: npm run e2e:acceptance
        env:
          E2E_ACCEPTANCE_MODE: 'true'
          E2E_FIXTURE_MODE: 'false'
          E2E_SKIP_WEB_SERVER: 'true'
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
          E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
          E2E_MANAGER_BUSINESS_UNIT_ID: ${{ vars.E2E_MANAGER_BUSINESS_UNIT_ID }}
          E2E_EDITOR_EMAIL: ${{ secrets.E2E_EDITOR_EMAIL }}
          E2E_EDITOR_PASSWORD: ${{ secrets.E2E_EDITOR_PASSWORD }}
          E2E_EDITOR_BUSINESS_UNIT_ID: ${{ vars.E2E_EDITOR_BUSINESS_UNIT_ID }}
          E2E_DENIED_EMAIL: ${{ secrets.E2E_DENIED_EMAIL }}
          E2E_DENIED_PASSWORD: ${{ secrets.E2E_DENIED_PASSWORD }}
          E2E_DENIED_BUSINESS_UNIT_ID: ${{ vars.E2E_DENIED_BUSINESS_UNIT_ID }}
          E2E_BATCH_ID: ${{ vars.E2E_BATCH_ID }}
          E2E_UPLOAD_FILE: ${{ vars.E2E_UPLOAD_FILE }}
          E2E_LEAD_ID: ${{ vars.E2E_LEAD_ID }}
          E2E_REVISION_LEAD_ID: ${{ vars.E2E_REVISION_LEAD_ID }}
          E2E_RFQ_ID: ${{ vars.E2E_RFQ_ID }}
          E2E_QUOTE_ID: ${{ vars.E2E_QUOTE_ID }}
          E2E_NEXORA_SERIAL: ${{ vars.E2E_NEXORA_SERIAL }}
          E2E_CUSTOMER_NAME: ${{ vars.E2E_CUSTOMER_NAME }}
          E2E_DASHBOARD_KPI_LABEL: ${{ vars.E2E_DASHBOARD_KPI_LABEL }}
          E2E_DASHBOARD_KPI_VALUE: ${{ vars.E2E_DASHBOARD_KPI_VALUE }}
          E2E_DASHBOARD_DRILLDOWN_COUNT: ${{ vars.E2E_DASHBOARD_DRILLDOWN_COUNT }}
          E2E_EXPECTED_NEW_LEADS: ${{ vars.E2E_EXPECTED_NEW_LEADS }}
          E2E_EXPECTED_EXACT_DUPLICATES: ${{ vars.E2E_EXPECTED_EXACT_DUPLICATES }}
          E2E_EXPECTED_REVISIONS: ${{ vars.E2E_EXPECTED_REVISIONS }}
          E2E_EXPECTED_POSSIBLE_MATCHES: ${{ vars.E2E_EXPECTED_POSSIBLE_MATCHES }}

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright
          path: |
            Frontend/playwright-report
            Frontend/test-results/playwright
          if-no-files-found: ignore
